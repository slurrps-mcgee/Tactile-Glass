<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="tgMarkTitle">
  <title id="tgMarkTitle">TactileGlass</title>
  <defs>
    <linearGradient id="tgGlass" x1="18%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#eef1f7"/>
      <stop offset="55%" stop-color="#c9d0de"/>
      <stop offset="100%" stop-color="#aeb6c6"/>
    </linearGradient>
    <linearGradient id="tgSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tgSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#6b6580" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="5" y="10" width="47" height="47" rx="14" fill="#9f96b4" filter="url(#tgSoft)"/>
  <rect x="11" y="5" width="47" height="47" rx="14" fill="url(#tgGlass)" filter="url(#tgSoft)"/>
  <rect x="11" y="5" width="47" height="47" rx="14" fill="url(#tgSheen)"/>
  <rect x="11.75" y="5.75" width="45.5" height="45.5" rx="13.25" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.25"/>
  <!-- Center of glass tile: (11+47/2, 5+47/2) = (34.5, 28.5) -->
  <text
    x="34.5"
    y="28.5"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Futura, Trebuchet MS, Arial, system-ui, sans-serif"
    font-size="26"
    font-weight="700"
    letter-spacing="0.02em"
    fill="#2a2740"
  >TG</text>
</svg>
