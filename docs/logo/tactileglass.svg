<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 64" role="img" aria-labelledby="tgLogoTitle">
  <title id="tgLogoTitle">TactileGlass.css</title>
  <defs>
    <linearGradient id="tgGlassFull" x1="18%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#eef1f7"/>
      <stop offset="55%" stop-color="#c9d0de"/>
      <stop offset="100%" stop-color="#aeb6c6"/>
    </linearGradient>
    <linearGradient id="tgSheenFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tgSoftFull" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#6b6580" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- Mark: glass tile x=7 w=47 → center 30.5; y=5 h=47 → center 28.5 -->
  <rect x="1" y="10" width="47" height="47" rx="14" fill="#9f96b4" filter="url(#tgSoftFull)"/>
  <rect x="7" y="5" width="47" height="47" rx="14" fill="url(#tgGlassFull)" filter="url(#tgSoftFull)"/>
  <rect x="7" y="5" width="47" height="47" rx="14" fill="url(#tgSheenFull)"/>
  <rect x="7.75" y="5.75" width="45.5" height="45.5" rx="13.25" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.25"/>
  <text
    x="30.5"
    y="28.5"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Futura, Trebuchet MS, Arial, system-ui, sans-serif"
    font-size="26"
    font-weight="700"
    letter-spacing="0.02em"
    fill="#2a2740"
  >TG</text>
  <!-- Wordmark -->
  <text x="66" y="31" font-family="Futura, Trebuchet MS, Arial, system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.02em" fill="currentColor">TactileGlass</text>
  <text x="66" y="49" font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.16em" fill="currentColor" opacity="0.6">CSS</text>
</svg>
